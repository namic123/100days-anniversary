<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Mockup 03 — Sunflower Illustrated Box</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f7eedc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Georgia', serif;
            overflow: hidden;
            perspective: 1200px;
        }

        .scene {
            width: 390px;
            max-width: 100vw;
            height: 844px;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Sunflower decorations - floating background */
        .bg-sunflower {
            position: absolute;
            pointer-events: none;
            opacity: 0.15;
        }

        .bg-sunflower::before {
            content: '';
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle at center, #3d2b1f 30%, #f4be3a 32%, #f4be3a 100%);
        }

        .bg-sunflower::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 80px;
            top: -10px;
            left: -10px;
            border-radius: 50%;
            background:
                radial-gradient(ellipse 35% 12% at 50% 0%, #f4be3a 70%, transparent 72%),
                radial-gradient(ellipse 35% 12% at 100% 50%, #f4be3a 70%, transparent 72%),
                radial-gradient(ellipse 35% 12% at 50% 100%, #f4be3a 70%, transparent 72%),
                radial-gradient(ellipse 35% 12% at 0% 50%, #f4be3a 70%, transparent 72%),
                radial-gradient(ellipse 35% 12% at 85% 15%, #f4be3a 70%, transparent 72%),
                radial-gradient(ellipse 35% 12% at 85% 85%, #f4be3a 70%, transparent 72%),
                radial-gradient(ellipse 35% 12% at 15% 85%, #f4be3a 70%, transparent 72%),
                radial-gradient(ellipse 35% 12% at 15% 15%, #f4be3a 70%, transparent 72%);
        }

        .bg-sunflower:nth-child(1) { top: 8%; left: 10%; transform: scale(0.7) rotate(-15deg); }
        .bg-sunflower:nth-child(2) { top: 15%; right: 8%; transform: scale(0.5) rotate(20deg); }
        .bg-sunflower:nth-child(3) { bottom: 20%; left: 5%; transform: scale(0.6) rotate(10deg); }
        .bg-sunflower:nth-child(4) { bottom: 12%; right: 12%; transform: scale(0.4) rotate(-25deg); }
        .bg-sunflower:nth-child(5) { top: 45%; left: 3%; transform: scale(0.35) rotate(45deg); }

        /* Leaf accents */
        .bg-leaf {
            position: absolute;
            width: 20px;
            height: 35px;
            background: #7e8a56;
            border-radius: 50% 0 50% 0;
            opacity: 0.2;
            pointer-events: none;
        }

        .bg-leaf:nth-child(6) { top: 25%; right: 20%; transform: rotate(30deg); }
        .bg-leaf:nth-child(7) { bottom: 30%; left: 15%; transform: rotate(-45deg); }
        .bg-leaf:nth-child(8) { top: 60%; right: 8%; transform: rotate(60deg) scale(0.7); }

        /* Prompt text */
        .prompt {
            position: absolute;
            top: 18%;
            text-align: center;
            color: #5a4a3a;
            font-size: 14px;
            letter-spacing: 0.5px;
            opacity: 1;
            transition: opacity 0.6s ease;
        }

        .prompt.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Gift Box */
        .box-container {
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
        }

        .box-container:hover {
            transform: translateY(-3px);
        }

        .box-container.opened {
            pointer-events: none;
        }

        /* Box shadow */
        .box-shadow {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 20px;
            background: radial-gradient(ellipse, rgba(80, 60, 40, 0.2) 0%, transparent 70%);
            transition: all 0.8s ease;
        }

        .box-container.opened .box-shadow {
            width: 220px;
            opacity: 0.5;
        }

        /* Box body */
        .box-body {
            width: 180px;
            height: 140px;
            background: #fff9ed;
            border: 2.5px solid #d4a853;
            border-radius: 4px;
            position: relative;
            transform-style: preserve-3d;
        }

        /* Sunflower on the box front */
        .box-sunflower {
            position: absolute;
            width: 50px;
            height: 50px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .box-sunflower::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, #2a1d10 40%, #3d2b1f 100%);
            z-index: 2;
        }

        .box-sunflower::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 50px;
            top: 0;
            left: 0;
            border-radius: 50%;
            background:
                radial-gradient(ellipse 38% 14% at 50% 5%, #f4be3a 65%, transparent 67%),
                radial-gradient(ellipse 14% 38% at 95% 50%, #f4be3a 65%, transparent 67%),
                radial-gradient(ellipse 38% 14% at 50% 95%, #f4be3a 65%, transparent 67%),
                radial-gradient(ellipse 14% 38% at 5% 50%, #f4be3a 65%, transparent 67%),
                radial-gradient(ellipse 32% 12% at 82% 18%, #f4be3a 65%, transparent 67%),
                radial-gradient(ellipse 32% 12% at 82% 82%, #f4be3a 65%, transparent 67%),
                radial-gradient(ellipse 32% 12% at 18% 82%, #f4be3a 65%, transparent 67%),
                radial-gradient(ellipse 32% 12% at 18% 18%, #f4be3a 65%, transparent 67%),
                radial-gradient(ellipse 28% 11% at 65% 8%, #e8ad2e 60%, transparent 62%),
                radial-gradient(ellipse 28% 11% at 92% 35%, #e8ad2e 60%, transparent 62%),
                radial-gradient(ellipse 28% 11% at 92% 65%, #e8ad2e 60%, transparent 62%),
                radial-gradient(ellipse 28% 11% at 65% 92%, #e8ad2e 60%, transparent 62%),
                radial-gradient(ellipse 28% 11% at 35% 92%, #e8ad2e 60%, transparent 62%),
                radial-gradient(ellipse 28% 11% at 8% 65%, #e8ad2e 60%, transparent 62%),
                radial-gradient(ellipse 28% 11% at 8% 35%, #e8ad2e 60%, transparent 62%),
                radial-gradient(ellipse 28% 11% at 35% 8%, #e8ad2e 60%, transparent 62%);
        }

        /* Small leaves on box */
        .box-leaf {
            position: absolute;
            width: 12px;
            height: 22px;
            background: #7e8a56;
            border-radius: 50% 0 50% 0;
            opacity: 0.8;
        }

        .box-leaf:nth-child(2) {
            bottom: 20px;
            left: 25px;
            transform: rotate(-30deg);
        }

        .box-leaf:nth-child(3) {
            bottom: 25px;
            right: 20px;
            transform: rotate(40deg);
        }

        .box-leaf:nth-child(4) {
            top: 20px;
            right: 30px;
            transform: rotate(-50deg);
            width: 10px;
            height: 18px;
        }

        /* Box ribbon */
        .box-ribbon-v {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 100%;
            background: linear-gradient(90deg, #d4a853 0%, #e8c46a 50%, #d4a853 100%);
            opacity: 0.6;
        }

        .box-ribbon-h {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 100%;
            height: 22px;
            background: linear-gradient(180deg, #d4a853 0%, #e8c46a 50%, #d4a853 100%);
            opacity: 0.6;
        }

        /* Box lid */
        .box-lid {
            width: 190px;
            height: 30px;
            background: #fff9ed;
            border: 2.5px solid #d4a853;
            border-radius: 4px 4px 0 0;
            position: absolute;
            top: -30px;
            left: -5px;
            transform-origin: bottom left;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 10;
        }

        .box-lid::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 8px;
            background: linear-gradient(90deg, #d4a853 0%, #e8c46a 50%, #d4a853 100%);
            border-radius: 2px;
            opacity: 0.7;
        }

        .box-container.opened .box-lid {
            transform: rotateX(-130deg) translateZ(-5px);
        }

        /* Box open animation for body */
        .box-container.opened .box-body {
            animation: boxSettle 0.5s ease 0.8s forwards;
        }

        @keyframes boxSettle {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* Diary/Book */
        .diary-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            cursor: pointer;
            transition: transform 0.3s ease;
            z-index: 20;
        }

        .diary-container.visible {
            animation: bounceUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .diary-container:hover {
            transform: translate(-50%, -50%) scale(1.03);
        }

        @keyframes bounceUp {
            0% {
                transform: translate(-50%, 20%) scale(0.3);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            75% {
                transform: translate(-50%, -55%) scale(1.05);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .diary {
            width: 200px;
            height: 270px;
            background: linear-gradient(135deg, #fefcf5 0%, #f5edd8 100%);
            border: 2px solid #c9a96e;
            border-radius: 3px 8px 8px 3px;
            position: relative;
            box-shadow:
                -3px 0 0 #e8dcc4,
                -6px 0 0 #f0e6d2,
                4px 8px 20px rgba(80, 60, 30, 0.2);
            transform-style: preserve-3d;
        }

        /* Book spine effect */
        .diary::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 15px;
            height: 100%;
            background: linear-gradient(90deg, #c9a96e 0%, #e0cda3 40%, transparent 100%);
            border-radius: 3px 0 0 3px;
            opacity: 0.4;
        }

        /* Pressed flower aesthetic - subtle texture */
        .diary::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 30% 70%, rgba(126, 138, 86, 0.06) 0%, transparent 30%),
                radial-gradient(circle at 70% 30%, rgba(244, 190, 58, 0.04) 0%, transparent 25%),
                radial-gradient(circle at 80% 80%, rgba(126, 138, 86, 0.04) 0%, transparent 20%);
            pointer-events: none;
        }

        .diary-title {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #4a3a2a;
            font-size: 16px;
            line-height: 1.6;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .diary-title .subtitle {
            font-size: 11px;
            color: #8a7a6a;
            margin-top: 6px;
            letter-spacing: 2px;
        }

        /* Sunflower doodle on diary */
        .diary-sunflower {
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 36px;
        }

        .diary-sunflower::before {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: #3d2b1f;
            z-index: 2;
        }

        .diary-sunflower::after {
            content: '';
            position: absolute;
            width: 36px;
            height: 36px;
            top: 0;
            left: 0;
            border-radius: 50%;
            background:
                radial-gradient(ellipse 36% 13% at 50% 5%, #f4be3a 60%, transparent 62%),
                radial-gradient(ellipse 13% 36% at 95% 50%, #f4be3a 60%, transparent 62%),
                radial-gradient(ellipse 36% 13% at 50% 95%, #f4be3a 60%, transparent 62%),
                radial-gradient(ellipse 13% 36% at 5% 50%, #f4be3a 60%, transparent 62%),
                radial-gradient(ellipse 30% 11% at 80% 20%, #f4be3a 55%, transparent 57%),
                radial-gradient(ellipse 30% 11% at 80% 80%, #f4be3a 55%, transparent 57%),
                radial-gradient(ellipse 30% 11% at 20% 80%, #f4be3a 55%, transparent 57%),
                radial-gradient(ellipse 30% 11% at 20% 20%, #f4be3a 55%, transparent 57%);
        }

        /* Small stem on diary sunflower */
        .diary-stem {
            position: absolute;
            top: 68%;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 25px;
            background: #7e8a56;
            border-radius: 1px;
        }

        .diary-stem::before {
            content: '';
            position: absolute;
            bottom: 5px;
            left: -4px;
            width: 8px;
            height: 12px;
            background: #7e8a56;
            border-radius: 50% 0 50% 0;
            transform: rotate(-20deg);
            opacity: 0.8;
        }

        /* Page flip preview */
        .page-preview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fefcf5;
            border-radius: 3px 8px 8px 3px;
            opacity: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            transform: rotateY(-5deg);
            transition: all 0.4s ease;
        }

        .page-preview.visible {
            opacity: 1;
            transform: rotateY(0deg);
            pointer-events: auto;
        }

        .page-preview .page-date {
            font-size: 11px;
            color: #a0906e;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .page-preview .page-content {
            font-size: 14px;
            color: #5a4a3a;
            line-height: 2;
            text-align: center;
        }

        .page-preview .page-doodle {
            margin-top: 20px;
            width: 24px;
            height: 24px;
            position: relative;
        }

        .page-preview .page-doodle::before {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: #3d2b1f;
        }

        .page-preview .page-doodle::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background:
                radial-gradient(ellipse 36% 14% at 50% 5%, #f4be3a 55%, transparent 57%),
                radial-gradient(ellipse 14% 36% at 95% 50%, #f4be3a 55%, transparent 57%),
                radial-gradient(ellipse 36% 14% at 50% 95%, #f4be3a 55%, transparent 57%),
                radial-gradient(ellipse 14% 36% at 5% 50%, #f4be3a 55%, transparent 57%),
                radial-gradient(ellipse 28% 11% at 80% 20%, #f4be3a 50%, transparent 52%),
                radial-gradient(ellipse 28% 11% at 80% 80%, #f4be3a 50%, transparent 52%),
                radial-gradient(ellipse 28% 11% at 20% 80%, #f4be3a 50%, transparent 52%),
                radial-gradient(ellipse 28% 11% at 20% 20%, #f4be3a 50%, transparent 52%);
        }

        .page-nav {
            position: absolute;
            bottom: 20px;
            font-size: 10px;
            color: #b0a08a;
            letter-spacing: 1px;
        }

        /* Confetti / particles on open */
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
        }

        .box-container.opened .particle {
            animation: particleFloat 1.5s ease forwards;
        }

        @keyframes particleFloat {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* Label */
        .label {
            position: absolute;
            bottom: 30px;
            font-size: 10px;
            color: #b0a08a;
            letter-spacing: 1.5px;
            text-transform: lowercase;
        }

        /* Fade out box */
        .box-container.fade-out {
            animation: fadeDown 0.6s ease forwards;
        }

        @keyframes fadeDown {
            to {
                transform: translateY(30px) scale(0.9);
                opacity: 0;
            }
        }

        /* Click ripple */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(244, 190, 58, 0.3);
            transform: scale(0);
            animation: rippleAnim 0.6s ease forwards;
            pointer-events: none;
        }

        @keyframes rippleAnim {
            to {
                transform: scale(3);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="scene">
        <!-- Background decorations -->
        <div class="bg-sunflower"></div>
        <div class="bg-sunflower"></div>
        <div class="bg-sunflower"></div>
        <div class="bg-sunflower"></div>
        <div class="bg-sunflower"></div>
        <div class="bg-leaf"></div>
        <div class="bg-leaf"></div>
        <div class="bg-leaf"></div>

        <!-- Prompt -->
        <p class="prompt">tap to open</p>

        <!-- Gift Box -->
        <div class="box-container" id="giftBox">
            <div class="box-lid"></div>
            <div class="box-body">
                <div class="box-ribbon-v"></div>
                <div class="box-ribbon-h"></div>
                <div class="box-sunflower"></div>
                <div class="box-leaf"></div>
                <div class="box-leaf"></div>
                <div class="box-leaf"></div>
            </div>
            <div class="box-shadow"></div>

            <!-- Particles -->
            <div class="particle" style="background:#f4be3a; top:20%; left:30%; --tx:-40px; --ty:-60px; animation-delay:0.3s;"></div>
            <div class="particle" style="background:#7e8a56; top:20%; left:60%; --tx:50px; --ty:-50px; animation-delay:0.4s;"></div>
            <div class="particle" style="background:#f4be3a; top:10%; left:50%; --tx:10px; --ty:-80px; animation-delay:0.5s;"></div>
            <div class="particle" style="background:#e8c46a; top:25%; left:40%; --tx:-60px; --ty:-40px; animation-delay:0.6s;"></div>
            <div class="particle" style="background:#7e8a56; top:15%; left:70%; --tx:40px; --ty:-70px; animation-delay:0.35s;"></div>
            <div class="particle" style="background:#f4be3a; top:20%; left:20%; --tx:-50px; --ty:-55px; animation-delay:0.45s;"></div>
        </div>

        <!-- Diary -->
        <div class="diary-container" id="diary">
            <div class="diary">
                <div class="diary-title">
                    우리의 100일 일기
                    <div class="subtitle">OUR 100 DAYS</div>
                </div>
                <div class="diary-sunflower"></div>
                <div class="diary-stem"></div>

                <!-- Page previews -->
                <div class="page-preview" id="page1">
                    <div class="page-date">Day 1</div>
                    <div class="page-content">
                        처음 만난 날,<br>
                        해바라기처럼<br>
                        환하게 웃던 너
                    </div>
                    <div class="page-doodle"></div>
                    <div class="page-nav">tap to continue</div>
                </div>

                <div class="page-preview" id="page2">
                    <div class="page-date">Day 50</div>
                    <div class="page-content">
                        반쯤 왔을 때,<br>
                        우리가 함께한 날들이<br>
                        꽃밭이 되었어
                    </div>
                    <div class="page-doodle"></div>
                    <div class="page-nav">tap to continue</div>
                </div>

                <div class="page-preview" id="page3">
                    <div class="page-date">Day 100</div>
                    <div class="page-content">
                        백 송이 해바라기가<br>
                        피어난 우리의 정원,<br>
                        계속 가꿔가자
                    </div>
                    <div class="page-doodle"></div>
                    <div class="page-nav">tap to close</div>
                </div>
            </div>
        </div>

        <!-- Label -->
        <span class="label">design mockup 03 — sunflower illustrated box</span>
    </div>

    <script>
        const giftBox = document.getElementById('giftBox');
        const diary = document.getElementById('diary');
        const prompt = document.querySelector('.prompt');
        const pages = [
            document.getElementById('page1'),
            document.getElementById('page2'),
            document.getElementById('page3')
        ];
        let currentPage = -1;
        let boxOpened = false;
        let diaryVisible = false;

        // Box click handler
        giftBox.addEventListener('click', function(e) {
            if (boxOpened) return;
            boxOpened = true;

            // Hide prompt
            prompt.classList.add('hidden');

            // Add ripple effect
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.width = '50px';
            ripple.style.height = '50px';
            const rect = giftBox.getBoundingClientRect();
            ripple.style.left = (e.clientX - rect.left - 25) + 'px';
            ripple.style.top = (e.clientY - rect.top - 25) + 'px';
            giftBox.appendChild(ripple);

            // Open box
            giftBox.classList.add('opened');

            // After lid opens, fade box and show diary
            setTimeout(() => {
                giftBox.classList.add('fade-out');
            }, 1800);

            setTimeout(() => {
                giftBox.style.display = 'none';
                diary.classList.add('visible');
                diaryVisible = true;
            }, 2300);
        });

        // Diary click handler - page flip
        diary.addEventListener('click', function() {
            if (!diaryVisible) return;

            currentPage++;

            if (currentPage < pages.length) {
                // Hide all pages first
                pages.forEach(p => p.classList.remove('visible'));
                // Show current page
                pages[currentPage].classList.add('visible');
            } else {
                // Close the book - hide all pages
                pages.forEach(p => p.classList.remove('visible'));
                currentPage = -1;
            }
        });
    </script>
</body>
</html>
